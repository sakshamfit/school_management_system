<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>School Management System — Admin Control Panel</title>
  <link rel="stylesheet" href="/admin/styles.css" />
</head>
<body>
  <div id="app"></div>

  <template id="tpl-login">
    <div class="login-wrap">
      <div class="login-card">
        <div class="brand-badge">🏫</div>
        <h1>Admin Control Panel</h1>
        <p class="muted">School Management System licensing service</p>
        <div id="login-error" class="alert error hidden"></div>
        <form id="login-form">
          <label>Email</label>
          <input type="email" id="login-email" autocomplete="username" required />
          <label>Password</label>
          <input type="password" id="login-password" autocomplete="current-password" required />
          <button type="submit" class="btn primary block">Sign in</button>
        </form>
      </div>
    </div>
  </template>

  <template id="tpl-shell">
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-badge small">🏫</div>
          <div>
            <div class="brand-title">School MS Admin</div>
            <div class="brand-sub">Licensing Service</div>
          </div>
        </div>
        <nav>
          <a href="#/dashboard" data-route="dashboard">📊 Dashboard</a>
          <a href="#/schools" data-route="schools">🏫 Schools</a>
          <a href="#/licenses" data-route="licenses">🔑 Licenses</a>
          <a href="#/devices" data-route="devices">💻 Devices</a>
          <a href="#/releases" data-route="releases">⬇️ Downloads &amp; Versions</a>
          <a href="#/settings" data-route="settings">⚙️ Settings</a>
          <a href="#/logs" data-route="logs">📜 System Logs</a>
        </nav>
        <div class="sidebar-footer">
          <span id="admin-name" class="muted"></span>
          <button id="logout-btn" class="btn ghost small">Sign out</button>
        </div>
      </aside>
      <main id="main" class="main"></main>
    </div>
  </template>

  <script src="/admin/app.js"></script>
</body>
</html>
