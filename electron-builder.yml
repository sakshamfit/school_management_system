appId: com.mspublicschool.management
productName: M.S. PUBLIC SCHOOL Management System
copyright: Copyright © 2026 M.S. PUBLIC SCHOOL

directories:
  output: release
  buildResources: public

files:
  - dist/**/*
  - desktop/**/*
  - electron.cjs
  - public/icon.svg
  - package.json
  - "!**/*.ts"
  - "!**/*.map"
  - "!src/**/*"
  - "!tests/**/*"
  - "!**/*.md"
  - "!node_modules/**/test/**/*"
  - "!node_modules/**/tests/**/*"
  - "!node_modules/**/*.map"

extraResources:
  - from: public/
    to: public/
    filter:
      - icon.svg

win:
  target:
    - target: nsis
      arch:
        - x64
        - ia32
  icon: public/icon.svg
  publisherName: M.S. PUBLIC SCHOOL
  verifyUpdateCodeSignature: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: M.S. PUBLIC SCHOOL
  installerIcon: public/icon.svg
  uninstallerIcon: public/icon.svg
  installerHeaderIcon: public/icon.svg
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
  artifactName: SchoolManagementSetup-${version}-${arch}.${ext}
  displayLanguageSelector: false
  multiLanguageInstaller: false
  language: 1033

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: public/icon.svg
  category: public.app-category.education

linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: public/icon.svg
  category: Education

publish:
  provider: generic
  url: https://releases.mspublicschool.edu.in/
  channel: latest

# Security: no asar unpack for native modules
asar: true
asarUnpack:
  - "**/*.node"

# Remove dev dependencies and sensitive files
afterPack: build/afterPack.js
